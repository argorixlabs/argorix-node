name: Publish npm Package

# Publishes `@argorix/sdk` on a `v*` tag. The deprecated `@governanceai/sdk` shim is
# published by publish-npm-compat.yml.
#
# Authenticates with npm trusted publishing (OIDC) — there is no publish token. npm is
# restricting 2FA-bypass tokens for direct publishing, so a long-lived token in CI is a
# dead end; the short-lived OIDC credential is minted per run from `id-token: write`.
#
# Requires a trusted publisher on npmjs.com:
#   @argorix/sdk > Settings > Trusted Publisher > GitHub Actions
#     Organization or user: argorixlabs
#     Repository:           argorix-node
#     Workflow filename:    publish-npm.yml
#     Allowed actions:      npm publish
#
# The trusted publisher lives in the package's own settings, so the package has to exist
# first. Version 0.2.0 was published by hand to create it; every release after that goes
# through here.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@argorix/sdk
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 24 ships an npm new enough for trusted publishing (needs npm >= 11.5.1 and
      # Node >= 22.14.0). `registry-url` is still required: it points the CLI at the
      # registry that issues the OIDC exchange.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Fail loudly here rather than with an opaque auth error at publish time.
      - name: Verify npm supports trusted publishing
        run: |
          required="11.5.1"
          actual="$(npm --version)"
          echo "npm $actual (trusted publishing needs >= $required)"
          if [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n1)" != "$required" ]; then
            echo "npm $actual is too old for trusted publishing" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: node --test test/*.test.mjs

      - name: Fail if the tag does not match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match package.json version $version" >&2
            exit 1
          fi

      # No NODE_AUTH_TOKEN: the CLI detects the Actions OIDC environment and exchanges it
      # for a short-lived credential. Provenance is generated automatically under trusted
      # publishing, so `--provenance` is not passed.
      - name: Publish to npm
        run: npm publish --access public
