name: Publish npm Compatibility Shim

# Publishes the deprecated `@governanceai/sdk` package from compat/governanceai-sdk.
# Manual on purpose: the shim only changes on a rebrand-level release.
#
# Authenticates with npm trusted publishing (OIDC) — there is no publish token.
#
# Requires a trusted publisher on npmjs.com:
#   @governanceai/sdk > Settings > Trusted Publisher > GitHub Actions
#     Organization or user: argorixlabs
#     Repository:           argorix-node
#     Workflow filename:    publish-npm-compat.yml
#     Allowed actions:      npm publish
#
# This package already exists on npm (0.1.0), so its trusted publisher can be configured
# right away — unlike @argorix/sdk, which needed a first manual publish to exist.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm-compat
      url: https://www.npmjs.com/package/@governanceai/sdk
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify npm supports trusted publishing
        run: |
          required="11.5.1"
          actual="$(npm --version)"
          echo "npm $actual (trusted publishing needs >= $required)"
          if [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n1)" != "$required" ]; then
            echo "npm $actual is too old for trusted publishing" >&2
            exit 1
          fi

      # No NODE_AUTH_TOKEN: the CLI exchanges the Actions OIDC token for a short-lived
      # credential. Provenance is automatic under trusted publishing.
      - name: Publish to npm
        working-directory: compat/governanceai-sdk
        run: npm publish --access public
