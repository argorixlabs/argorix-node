name: Publish npm Compatibility Shim

# Publishes the deprecated `@governanceai/sdk` package from compat/governanceai-sdk.
# Manual on purpose: the shim only changes on a rebrand-level release.
#
# Requires the `NPM_TOKEN` secret with publish rights on the `@governanceai` scope.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm-compat
      url: https://www.npmjs.com/package/@governanceai/sdk
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        working-directory: compat/governanceai-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
